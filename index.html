<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Автошкола ТОС — вопросы по сайту</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#141414;--muted:#55555c;--line:#dddde2;--acc:#1e7a34;--bad:#bf2f4c}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1e1e22;--ink:#f2f2f4;--muted:#b8b8c0;--line:#33333a;--acc:#5fd07a;--bad:#f2728b;color-scheme:dark}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:0 16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
button{font:inherit;font-weight:600;min-height:48px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;transition:transform 140ms cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.97)}button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13.5px;min-height:1.2em}
</style></head><body>
<form id="f"><h1>Автошкола ТОС: вопросы по сайту</h1><p>Страница под паролем. Пароль — у того, кто прислал ссылку.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="Пароль" required autofocus>
<label><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
<button id="go">Открыть</button><div id="err" role="alert"></div></form>
